name: Release gate
description: Track controlled tester, staging, paid pilot, or production release gates.
title: "Release gate: "
labels: ["status-needs-human", "codex-human-gate-required"]
body:
  - type: dropdown
    id: gate
    attributes:
      label: Gate
      options:
        - FIRST_10_TESTERS
        - FIRST_25_TESTERS
        - PAID_PILOT
        - PRODUCTION
    validations:
      required: true
  - type: textarea
    id: current_status
    attributes:
      label: Current status
      placeholder: GO / NO-GO and why.
    validations:
      required: true
  - type: textarea
    id: required_evidence
    attributes:
      label: Required evidence
      placeholder: Checks, smoke reports, screenshots, approval, etc.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmations
      options:
        - label: Production remains NO-GO unless explicitly approved.
          required: true
        - label: No real users are contacted automatically.
          required: true
        - label: No real payments are created automatically.
          required: true
