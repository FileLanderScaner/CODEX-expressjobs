name: Release gate
description: Run or document a controlled release gate.
title: "[Release Gate]: "
labels: ["type-preview", "status-ready-for-codex", "preview-required"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Gate scope
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Gates required
      options:
        - label: Google Auth PASS
        - label: RLS smoke PASS
        - label: Preview browser smoke PASS
        - label: Secret scan PASS
        - label: Production NO-GO confirmed
        - label: PayPal live OFF
  - type: dropdown
    id: production
    attributes:
      label: Production action requested?
      options: ["no", "yes - blocked until human approval"]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence expected
