name: ExpressJobs Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

jobs:
  gates:
    name: ExpressJobs safe gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Static RLS tests
        run: npm run test:rls:static

      - name: Build
        run: npm run build

      - name: Production safety check
        run: npm run production:check

      - name: Diff whitespace check
        run: git diff --check
