name: expressjobs-release-gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run secret:scan
      - name: Staging check if env is available
        shell: bash
        run: |
          if [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && [ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            npm run staging:check
          else
            echo "STAGING_CHECK=BLOCKED_ENV_MISSING_OPTIONAL"
          fi
      - run: npm run test:rls:static
      - name: RLS smoke if env is available
        shell: bash
        run: |
          if [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && [ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] && [ -n "${EXPRESSJOBS_RLS_CLIENT_EMAIL:-}" ]; then
            npm run rls:smoke
          else
            echo "RLS_SMOKE=BLOCKED_ENV_MISSING_OPTIONAL"
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run production:check
