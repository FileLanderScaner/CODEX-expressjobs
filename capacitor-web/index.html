<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ExpressJobs</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #121826;
      }

      body {
        align-items: center;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 520px;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
        margin: 0 0 12px;
      }

      p {
        color: #4b5565;
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 18px;
      }

      .badge {
        color: #0f766e;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">APK de prueba</div>
      <h1>ExpressJobs</h1>
      <p>
        Este contenedor carga la app web de staging/local configurada en el
        build Android. No es produccion publica y no activa pagos reales.
      </p>
      <p>
        Para probar en emulador, ejecuta el servidor web local en el puerto
        3000 antes de abrir la APK.
      </p>
    </main>
  </body>
</html>
